/* ============================================================
   Rechenkern
   ============================================================ */
const num = v => { if (v === "" || v === null || v === undefined) return NaN; const x = parseFloat(String(v).replace(",", ".")); return x; };
const ok = v => Number.isFinite(num(v));
const LAMBDA_G = 2.0, RSI_F = 0.17, RSE = 0.04, RSI_W = 0.13, FG1 = 1.45, RHOCP = 0.34;

/* Äquivalenter U-Wert erdberührter Bauteile nach DIN EN ISO 13370 (ersetzt die Diagramme/Tabellen der DIN EN 12831). */
function uErd(typ, U, z, Bp, w) {
  const R = Math.max(0, 1 / U - (typ === "KW" ? RSI_W : RSI_F) - RSE);
  if (typ === "KW") {
    const zz = Math.max(z, 0.1);
    const dw = LAMBDA_G * (RSI_W + R + RSE);
    const dt = w + LAMBDA_G * (RSI_F + R + RSE); // Annahme: Boden ähnlich gedämmt wie Wand
    return (2 * LAMBDA_G / (Math.PI * zz)) * (1 + 0.5 * dt / (dt + zz)) * Math.log(zz / dw + 1);
  }
  const dt = w + LAMBDA_G * (RSI_F + R + RSE) + 0.5 * Math.max(z, 0);
  return dt < Bp ? (2 * LAMBDA_G / (Math.PI * Bp + dt)) * Math.log(Math.PI * Bp / dt + 1) : LAMBDA_G / (0.457 * Bp + dt);
}

function berechne(s) {
  const g = s.gebaeude, te = num(s.klima.te), tme = num(s.klima.tme);
  const bt = Object.fromEntries(s.bauteile.map(b => [b.id, b]));
  const Ag = num(g.Ag), P = num(g.P);
  const Bp = Ag > 0 && P > 0 ? Ag / (0.5 * P) : NaN;
  const dU = num(g.duwb) || 0, Gw = num(g.Gw) || 1, w = ok(g.wand) ? num(g.wand) : 0.3;
  const ab = ABSCHIRMUNG[g.abschirmung] || ABSCHIRMUNG.mittel, eps = (HOEHE[g.hoehe] || HOEHE.lt10)[1];
  const n50 = num(g.n50) || 0, mech = g.lueftung === "mech", eta = mech ? Math.min(Math.max(num(g.eta) || 0, 0), 0.95) : 0;
  const warn = [];
  if (!ok(te)) warn.push(["bad", "Klima", "Norm-Außentemperatur θe fehlt."]);

  const raeume = s.raeume.map(r => {
    const ti = num(r.theta), A = num(r.A), h = num(r.h), V = A * h, dT = ti - te;
    const valid = ok(ti) && A > 0 && h > 0 && ok(te) && dT > 0;
    const lines = r.flaechen.map(f => {
      const b = bt[f.bauteil], Af = num(f.A);
      const L = { f, b, A: Af, U: b ? num(b.U) : NaN, dU: 0, Ueq: null, fak: 1, H: 0, Phi: 0, err: null };
      if (!b) { L.err = "Bauteil wählen"; return L; }
      if (!(Af > 0)) { L.err = "Fläche fehlt"; return L; }
      if (!(L.U > 0)) { L.err = "U-Wert fehlt"; return L; }
      if (!valid) return L;
      if (f.ang === "aussen") { L.dU = dU; L.H = Af * (L.U + dU); }
      else if (f.ang === "unbeheizt") {
        const tu = ok(f.theta) ? num(f.theta) : ANG_THETA.unbeheizt;
        L.dU = dU; L.fak = (ti - tu) / dT; L.H = Af * (L.U + dU) * L.fak;
      } else if (f.ang === "raum" || f.ang === "nachbar") {
        const tj = ok(f.theta) ? num(f.theta) : ANG_THETA[f.ang];
        L.fak = (ti - tj) / dT; L.H = Af * L.U * L.fak;
      } else if (f.ang === "erdreich") {
        if (!ok(Bp)) { L.err = "Bodenplatte (A, P) in Schritt 2 fehlt"; return L; }
        if (!ok(tme)) { L.err = "Jahresmitteltemperatur fehlt"; return L; }
        const z = ok(f.z) ? num(f.z) : 0;
        L.Ueq = uErd(b.typ, L.U, z, Bp, w);
        L.fak = FG1 * ((ti - tme) / dT) * Gw;
        L.H = Af * L.Ueq * L.fak;
      }
      L.Phi = L.H * dT;
      return L;
    });
    const PhiT = lines.reduce((a, l) => a + l.Phi, 0);
    const PhiT_hull = lines.filter(l => l.f.ang !== "raum").reduce((a, l) => a + l.Phi, 0);
    const e = r.oeff == 0 ? 0 : r.oeff == 1 ? ab[1] : ab[2];
    const Vinf = valid ? 2 * V * n50 * e * eps : 0;
    const Vmin = valid ? (num(r.nmin) || 0) * V : 0;
    const Vrel = mech ? Vinf + Vmin * (1 - eta) : Math.max(Vinf, Vmin);
    const PhiV = valid ? RHOCP * Vrel * dT : 0;
    const PhiHU = valid ? (num(r.fRH) || 0) * A : 0;
    const HL = PhiT + PhiV + PhiHU;
    if (!ok(r.theta) || !(A > 0) || !(h > 0)) warn.push(["bad", r.name, "Temperatur, Fläche oder Raumhöhe fehlt."]);
    else if (ok(te) && dT <= 0) warn.push(["bad", r.name, "Raumtemperatur liegt nicht über der Norm-Außentemperatur."]);
    if (!r.flaechen.length) warn.push(["warn", r.name, "Keine Bauteilflächen erfasst."]);
    else if (!r.flaechen.some(f => f.ang !== "raum")) warn.push(["info", r.name, "Kein Bauteil an Außenluft, Erdreich oder unbeheizte Räume – nur Innenraum?"]);
    lines.forEach(l => { if (l.err) warn.push(["warn", r.name, (l.b ? l.b.name : "Fläche") + ": " + l.err]); });
    lines.forEach(l => { if (l.b && l.b.typ === "FE" && l.f.ang === "aussen" && l.U > 3.5) warn.push(["info", r.name, `${l.b.name}: U = ${fmt(l.U, 1)} W/(m²K) ist sehr hoch – Einfachverglasung?`]); });
    const spez = A > 0 ? HL / A : NaN;
    if (valid && spez > 180) warn.push(["warn", r.name, `Raumheizlast ${fmt(spez, 0)} W/m² ist sehr hoch – Eingaben prüfen.`]);
    return { r, ti, A, V, dT, valid, lines, PhiT, PhiT_hull, e, Vinf, Vmin, Vrel, PhiV, PhiHU, HL, spez };
  });

  // Gebäude: Transmission nur über die thermische Hülle (ohne Wärmeströme zwischen Räumen derselben Wohnung).
  const PhiT_geb = raeume.reduce((a, x) => a + x.PhiT_hull, 0);
  const sInf = raeume.reduce((a, x) => a + x.Vinf * Math.max(x.dT, 0), 0);
  const sMin = raeume.reduce((a, x) => a + x.Vmin * Math.max(x.dT, 0), 0);
  const PhiV_geb = RHOCP * (mech ? 0.5 * sInf + sMin * (1 - eta) : Math.max(0.5 * sInf, sMin));
  const PhiHU_geb = raeume.reduce((a, x) => a + x.PhiHU, 0);
  const HL_geb = PhiT_geb + PhiV_geb + PhiHU_geb;
  const Ages = raeume.reduce((a, x) => a + (x.A > 0 ? x.A : 0), 0);
  const Vges = raeume.reduce((a, x) => a + (x.V > 0 ? x.V : 0), 0);
  const summeRaeume = raeume.reduce((a, x) => a + x.HL, 0);
  const proTyp = {};
  raeume.forEach(x => x.lines.forEach(l => { if (l.b && l.f.ang !== "raum") proTyp[l.b.typ] = (proTyp[l.b.typ] || 0) + l.Phi; }));
  if (raeume.some(x => x.lines.some(l => l.f.ang === "erdreich")) && !ok(Bp)) warn.push(["bad", "Gebäude", "Für erdberührte Bauteile fehlen Bodenplattenfläche und Umfang."]);
  return { raeume, Bp, PhiT_geb, PhiV_geb, PhiHU_geb, HL_geb, Ages, Vges, summeRaeume, proTyp, warn, te };
}

/* ============================================================
   Hilfsfunktionen
   ============================================================ */
const fmt = (x, d = 0) => Number.isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
function klasse(spez) {
  if (!Number.isFinite(spez) || spez <= 0) return ["neutral", "keine Angabe"];
  if (spez < 30) return ["good", "sehr niedrig · Passivhaus-Niveau"];
  if (spez < 60) return ["good", "niedrig · Neubau / gut saniert"];
  if (spez < 100) return ["warn", "mittel · teilsaniert"];
  return ["bad", "hoch · unsaniert"];
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function fieldNum(id, label, sym, val, unit, hint = "", attrs = "") {

}
function fieldSel(id, label, opts, val, hint = "", attrs = "") {
  return `<div class="field"><label for="${id}">${label}</label><select id="${id}" ${attrs}>${opts.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(val) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
}
function fieldTxt(id, label, val, hint = "", attrs = "") {

}

/* Bindung: data-bind="pfad" auf Eingabefeldern. Pfadsegmente: gebaeude.n50, r:<id>.A, f:<rid>:<fid>.A, b:<id>.U */
function target(path) {
  const [head, key] = [path.slice(0, path.lastIndexOf(".")), path.slice(path.lastIndexOf(".") + 1)];
  let o;
  if (head.startsWith("r:")) o = S.raeume.find(r => r.id === head.slice(2));
  else if (head.startsWith("f:")) { const [, rid, fid] = head.split(":"); o = S.raeume.find(r => r.id === rid)?.flaechen.find(f => f.id === fid); }
  else if (head.startsWith("b:")) o = S.bauteile.find(b => b.id === head.slice(2));
  else o = S[head];
  return [o, key];
}

    <tr><td colspan="9" style="color:var(--ink-2)">Lüftung: V = ${fmt(x.V, 1)} m³ · V̇<sub>inf</sub> = 2·V·n₅₀·e·ε = ${fmt(x.Vinf, 1)} m³/h · V̇<sub>min</sub> = ${fmt(x.Vmin, 1)} m³/h → V̇ = ${fmt(x.Vrel, 1)} m³/h · Φ<sub>V</sub> = 0,34·V̇·ΔT = ${fmt(x.PhiV)} W</td></tr></tbody></table></div></details>`).join("");

      <div class="tile"><span class="lab"><i class="key" style="background:var(--s1)"></i>Transmission</span><span class="val">${kw(R.PhiT_geb)}<small>kW</small></span><span class="sub">${fmt(R.PhiT_geb / R.HL_geb * 100)} % der Heizlast</span></div>
      <div class="tile"><span class="lab"><i class="key" style="background:var(--s2)"></i>Lüftung</span><span class="val">${kw(R.PhiV_geb)}<small>kW</small></span><span class="sub">${fmt(R.PhiV_geb / R.HL_geb * 100)} % der Heizlast</span></div>

    </div>
    ${msgs ? `<section class="panel"><header><h3>Hinweise zur Plausibilität</h3><span class="chip ${R.warn.some(w => w[0] === "bad") ? "bad" : "warn"}">${R.warn.length}</span></header><div class="msgs">${msgs}</div></section>` : `<div class="msg info"><span style="color:var(--good)">✓</span><span>Keine Auffälligkeiten in den Eingaben gefunden.</span></div>`}
    <div class="charts">
      <section class="panel chart"><header><h3>Raumheizlast je Raum</h3><div class="legend"><span><i class="key" style="background:var(--s1)"></i>Transmission</span><span><i class="key" style="background:var(--s2)"></i>Lüftung</span><span><i class="key" style="background:var(--s3)"></i>Aufheizen</span></div></header><div id="ch-rooms"></div></section>
      <section class="panel chart"><header><h3>Transmission nach Bauteiltyp</h3></header><div id="ch-typ"></div></section>
    </div>
    <section class="panel"><header><h3>Raumweise Heizlast</h3><button class="btn small" data-act="csv">Tabelle kopieren (für Excel)</button></header>
      <div class="tbl-wrap"><table><thead><tr><th>Raum</th><th class="n">θ<sub>int</sub> °C</th><th class="n">A m²</th><th class="n">Φ<sub>T</sub> W</th><th class="n">Φ<sub>V</sub> W</th><th class="n">Φ<sub>RH</sub> W</th><th class="n">Φ<sub>HL</sub> W</th><th class="n">W/m²</th></tr></thead>
      <tbody>${rows}<tr class="sum"><td>Summe Räume</td><td></td><td class="n">${fmt(R.Ages, 1)}</td><td class="n">${fmt(R.raeume.reduce((a, x) => a + x.PhiT, 0))}</td><td class="n">${fmt(R.raeume.reduce((a, x) => a + x.PhiV, 0))}</td><td class="n">${fmt(R.PhiHU_geb)}</td><td class="n">${fmt(R.summeRaeume)}</td><td></td></tr>
      <tr class="sum" style="border-top:none"><td>Gebäudeheizlast</td><td></td><td></td><td class="n">${fmt(R.PhiT_geb)}</td><td class="n">${fmt(R.PhiV_geb)}</td><td class="n">${fmt(R.PhiHU_geb)}</td><td class="n">${fmt(R.HL_geb)}</td><td class="n">${fmt(R.HL_geb / R.Ages)}</td></tr></tbody></table></div>
      <p class="hint" style="color:var(--muted);font-size:.82rem">Die Raumheizlasten dienen der Auslegung der Heizflächen je Raum. Die Gebäudeheizlast dient der Auslegung des Wärmeerzeugers. Sie ist kleiner als die Summe der Räume: Wärmeströme zwischen Räumen derselben Wohnung heben sich auf, und nur etwa die Hälfte der Infiltration wirkt gleichzeitig.</p>
    </section>
    <section class="panel"><header><h3>Rechenweg je Raum</h3></header>${det}
      <div class="formula">Φ_HL,i  = Φ_T,i + Φ_V,i + Φ_RH,i
Φ_T,i   = Σ H_T,k · (θ_int,i − θ_e)
  Außen       H = A · (U + ΔU_WB)
  unbeheizt   H = A · (U + ΔU_WB) · b_u     b_u  = (θ_int − θ_u) / (θ_int − θ_e)
  Nachbarraum H = A · U · f_ij              f_ij = (θ_int − θ_j) / (θ_int − θ_e)
  Erdreich    H = A · U_equiv · f_g1 · f_g2 · G_w   f_g1 = 1,45   f_g2 = (θ_int − θ_m,e) / (θ_int − θ_e)
Φ_V,i   = 0,34 · V̇_i · (θ_int,i − θ_e)
  frei        V̇_i = max(V̇_inf,i ; V̇_min,i)
  Anlage      V̇_i = V̇_inf,i + V̇_min,i · (1 − η_WRG)
  V̇_inf,i = 2 · V_i · n50 · e_i · ε_i      V̇_min,i = n_min · V_i
Φ_RH,i  = f_RH · A_i
Gebäude: Φ_T über die Hülle, V̇ = max(0,5 · Σ V̇_inf ; Σ V̇_min)</div>
    </section>
    <section class="panel"><header><h3>Grenzen dieses Rechners</h3></header><div class="help"><ul>
      <li>Das Verfahren folgt dem Aufbau der DIN EN 12831-1 (Raum für Raum, Transmission, Lüftung, Aufheizen). Vorschlagswerte für Temperaturen, Luftwechsel und Klimadaten sind Richtwerte. Verbindliche Werte stehen in DIN/TS 12831-1 und Beiblatt 1.</li>
      <li>Der äquivalente U-Wert erdberührter Bauteile wird nach DIN EN ISO 13370 berechnet (Erdreich λ = 2,0 W/(mK)). Die Norm-Tabellen können leicht abweichen.</li>
      <li>Nicht abgebildet: detaillierte Wärmebrücken, Orientierungs- und Windfaktoren der Fassade, Raumhöhen über 5 m, Luftverbund mit Überströmung, außenliegende Nachbargebäude mit Sonderbedingungen.</li>
      <li>Für Förderanträge (z. B. BEG) oder den hydraulischen Abgleich ist eine Berechnung durch eine fachkundige Person mit geprüfter Software nötig. Dieses Ergebnis dient der Abschätzung und Plausibilisierung.</li>
    </ul></div></section>
    <section class="panel"><header><h3>Projekt sichern und laden</h3></header>

      ${ui.confirm === "neu" || ui.confirm === "beispiel" ? `<div class="confirm">Alle aktuellen Eingaben werden ersetzt. Vorher kopieren? <button class="btn small danger" data-act="${ui.confirm === "neu" ? "neu" : "beispiel"}">Ersetzen</button><button class="btn small" data-act="cancel">Abbrechen</button></div>` : ""}
      <div class="field"><label for="imp-txt">Projekt einfügen</label><textarea id="imp-txt" placeholder="Kopiertes Projekt (JSON) hier einfügen und „Laden“ wählen"></textarea></div>

    </section>${navFoot()}`;
}

/* ---------- Diagramme (SVG) ---------- */
function niceMax(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const svgEl = (t, a) => { const e = document.createElementNS("http://www.w3.org/2000/svg", t); for (const k in a) e.setAttribute(k, a[k]); return e; };
function tipShow(ev, title, rows) {
  const t = $("#tip"); t.replaceChildren();
  const h = document.createElement("div"); h.textContent = title; h.style.color = "var(--ink-2)"; t.appendChild(h);
  rows.forEach(([c, lab, val]) => { const r = document.createElement("div"); r.className = "tr"; if (c) { const i = document.createElement("i"); i.style.background = c; r.appendChild(i); } const v = document.createElement("span"); v.className = "tv"; v.textContent = val; const l = document.createElement("span"); l.textContent = lab; r.append(v, l); t.appendChild(r); });
  t.hidden = false;
  const rect = ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : { left: 0, top: 0 };
  const x = ev.clientX ?? rect.left, y = ev.clientY ?? rect.top;
  t.style.left = Math.min(x + 14, innerWidth - t.offsetWidth - 8) + "px"; t.style.top = Math.max(8, y - t.offsetHeight - 10) + "px";
}
const tipHide = () => { $("#tip").hidden = true; };
function hbar(container, items, keys) {
  // items: [{label, vals:[...]}], keys: [{name,color}]
  const el = $(container); if (!el) return; el.replaceChildren();
  if (!items.length) { el.textContent = "Noch keine Daten."; el.style.color = "var(--muted)"; return; }
  const W = Math.max(320, el.clientWidth || 560), lw = 130, rw = 56, bh = 18, gap = 12, top = 6, H = top + items.length * (bh + gap) + 22;
  const max = niceMax(Math.max(...items.map(i => i.vals.reduce((a, v) => a + Math.max(v, 0), 0))));
  const sx = v => lw + (W - lw - rw) * v / max;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const gg = svgEl("g", { class: "grid" });
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, x = sx(v); gg.appendChild(svgEl("line", { x1: x, x2: x, y1: top - 2, y2: H - 20 })); const t = svgEl("text", { x, y: H - 6, "text-anchor": "middle" }); t.textContent = fmt(v); gg.appendChild(t); }
  svg.appendChild(gg);
  items.forEach((it, i) => {
    const y = top + i * (bh + gap);
    const lab = svgEl("text", { x: lw - 8, y: y + bh / 2 + 4, "text-anchor": "end" }); lab.textContent = it.label.length > 20 ? it.label.slice(0, 19) + "…" : it.label; svg.appendChild(lab);
    let acc = 0; const segs = it.vals.map((v, k) => ({ v: Math.max(v, 0), k })).filter(s => s.v > 0);
    segs.forEach((s, j) => {
      const x0 = sx(acc), x1 = sx(acc + s.v); acc += s.v;
      const w = Math.max(0, x1 - x0 - (j < segs.length - 1 ? 2 : 0)), last = j === segs.length - 1;
      const path = last && w > 4
        ? svgEl("path", { d: `M${x0},${y}h${w - 4}a4,4 0 0 1 4,4v${bh - 8}a4,4 0 0 1 -4,4h${-(w - 4)}z`, fill: keys[s.k].color, class: "m", tabindex: 0 })
        : svgEl("rect", { x: x0, y, width: w, height: bh, fill: keys[s.k].color, class: "m", tabindex: 0 });
      const show = ev => tipShow(ev, it.label, it.vals.map((v, k) => [keys[k].color, keys[k].name, fmt(v) + " W"]).filter((r, k) => keys.length === 1 || it.vals[k] !== 0));
      path.addEventListener("pointermove", show); path.addEventListener("focus", show); path.addEventListener("pointerleave", tipHide); path.addEventListener("blur", tipHide);
      svg.appendChild(path);
    });
    const tot = it.vals.reduce((a, v) => a + v, 0);
    const tv = svgEl("text", { x: sx(acc) + 6, y: y + bh / 2 + 4, class: "v" }); tv.textContent = fmt(tot); svg.appendChild(tv);
  });
  el.appendChild(svg);
}
function drawCharts() {
  const R = berechne(S);
  const css = getComputedStyle(document.documentElement);
  const c = k => css.getPropertyValue(k).trim();
  hbar("#ch-rooms", R.raeume.map(x => ({ label: x.r.name, vals: [x.PhiT, x.PhiV, x.PhiHU] })), [{ name: "Transmission", color: c("--s1") }, { name: "Lüftung", color: c("--s2") }, { name: "Aufheizen", color: c("--s3") }]);
  const typ = Object.entries(R.proTyp).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: BTYP[k], vals: [v] }));
  hbar("#ch-typ", typ, [{ name: "Transmission", color: c("--s1") }]);
}

function updateOutputs() {
  const R = berechne(S);

  $("#top-hl").innerHTML = R.raeume.length ? `${fmt(R.HL_geb / 1000, 2)}<small>kW</small>` : "–";
  $("#top-spez").innerHTML = R.Ages > 0 ? `${fmt(R.HL_geb / R.Ages)}<small>W/m²</small>` : "–";
  const bp = $("#out-bp"); if (bp) bp.textContent = Number.isFinite(R.Bp) ? fmt(R.Bp, 2) + " m" : "–";
  R.raeume.forEach(x => {
    const res = document.getElementById("res-" + x.r.id); if (res) res.textContent = x.valid ? fmt(x.HL) + " W" : "–";
    const nm = document.getElementById("nm-" + x.r.id); if (nm) nm.textContent = x.r.name;
    const meta = document.getElementById("meta-" + x.r.id); if (meta) meta.textContent = `${fmt(x.ti, 0)} °C · ${fmt(x.A, 1)} m² · ${x.r.flaechen.length} Flächen${x.valid ? " · " + fmt(x.spez) + " W/m²" : ""}`;
    x.lines.forEach(l => { const o = document.getElementById("out-" + l.f.id); if (o) { o.textContent = l.err ? l.err : x.valid ? fmt(l.Phi) : "–"; o.style.color = l.err ? "var(--warn)" : ""; o.style.fontSize = l.err ? ".78rem" : ""; } });
  });
  document.querySelectorAll("[data-bind]").forEach(inp => {
    if (!inp.classList.contains("n")) return;
    const [o, k] = target(inp.dataset.bind); const v = o ? o[k] : "";
    inp.classList.toggle("bad", v !== "" && v !== undefined && !ok(v));
  });
  renderNav();
}

function render() {
  $("#main").innerHTML = STEPS[ui.step].render();
  updateOutputs();
  if (ui.step === 4) drawCharts();
}

/* ============================================================
   Ereignisse
   ============================================================ */
document.addEventListener("input", e => {
  const b = e.target.dataset?.bind; if (!b) return;
  const [o, k] = target(b); if (!o) return;
  o[k] = e.target.value; save(); updateOutputs();
});
document.addEventListener("change", e => {
  const t = e.target, act = t.dataset?.act;
  if (t.dataset?.bind) { const [o, k] = target(t.dataset.bind); if (o) o[k] = t.value; if (o && k === "ang" && ANG_THETA[t.value] === undefined) o.theta = ""; save(); if (t.dataset.rerender) render(); else updateOutputs(); return; }
  if (act === "ort") { const k = KLIMA.find(x => x[0] === t.value); S.klima.ort = t.value; if (k) { S.klima.te = k[1]; S.klima.tme = k[2]; } save(); render(); }
  if (act === "n50") { if (t.value) S.gebaeude.n50 = t.value; save(); render(); }
  if (act === "nutzung") { const r = S.raeume.find(r => r.id === t.dataset.id), n = NUTZUNG[t.value]; r.nutzung = t.value; r.theta = n[1]; r.nmin = n[2]; save(); render(); }
  if (t.id === "imp-file" && t.files[0]) { const fr = new FileReader(); fr.onload = () => importText(fr.result); fr.readAsText(t.files[0]); }
});
document.addEventListener("toggle", e => { const id = e.target.dataset?.room; if (!id) return; e.target.open ? ui.open.add(id) : ui.open.delete(id); }, true);

function importText(txt) {
  const m = $("#imp-msg");
  try {
    const d = JSON.parse(txt);
    if (!d || !d.gebaeude || !Array.isArray(d.raeume) || !Array.isArray(d.bauteile)) throw new Error("Struktur");
    S = d; S.beispiel = false; save(); ui.confirm = null; render(); toast("Projekt geladen");
  } catch (err) { if (m) m.textContent = "Das ist kein gültiges Projekt. Bitte den vollständigen kopierten Text einfügen."; }
}
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + " in die Zwischenablage kopiert"); }
  catch (e) { const ta = $("#imp-txt"); if (ta) { ta.value = text; ta.focus(); ta.select(); toast("Text markiert – mit Strg+C kopieren"); } }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-step],[data-act]"); if (!el || el.tagName === "SELECT") return;
  if (el.dataset.step !== undefined) { ui.step = +el.dataset.step; ui.confirm = null; save(); render(); window.scrollTo({ top: 0 }); return; }
  const act = el.dataset.act, id = el.dataset.id;
  const room = () => S.raeume.find(r => r.id === id);
  switch (act) {
    case "addB": S.bauteile.push({ id: nid("b"), typ: "AW", name: "Neues Bauteil", U: "" }); break;
    case "addVorlage": { const i = $("#b-vorlage").value; if (i === "") { toast("Bitte zuerst eine Vorlage wählen"); return; } const v = VORLAGEN[+i]; S.bauteile.push({ id: nid("b"), typ: v[0], name: v[1], U: v[2] }); break; }
    case "delB": S.bauteile = S.bauteile.filter(b => b.id !== id); break;
    case "addR": { const n = NUTZUNG.wohnen, r = { id: nid("r"), name: "Raum " + (S.raeume.length + 1), nutzung: "wohnen", theta: n[1], A: "", h: 2.5, nmin: n[2], oeff: 1, fRH: 0, flaechen: [] }; S.raeume.push(r); ui.open.add(r.id); break; }
    case "dupR": { const r = room(), c = JSON.parse(JSON.stringify(r)); c.id = nid("r"); c.name = r.name + " (Kopie)"; c.flaechen.forEach(f => f.id = nid("f")); S.raeume.splice(S.raeume.indexOf(r) + 1, 0, c); ui.open.add(c.id); break; }
    case "askDelR": ui.confirm = "delR:" + id; break;
    case "delR": S.raeume = S.raeume.filter(r => r.id !== id); ui.confirm = null; break;
    case "cancel": ui.confirm = null; break;
    case "addF": { const r = room(), aw = S.bauteile.find(b => b.typ === "AW") || S.bauteile[0]; r.flaechen.push({ id: nid("f"), bauteil: aw ? aw.id : "", ang: "aussen", A: "", theta: "", z: "" }); ui.open.add(r.id); break; }
    case "delF": { const r = S.raeume.find(r => r.id === el.dataset.r); r.flaechen = r.flaechen.filter(f => f.id !== id); break; }
    case "csv": {
      const R = berechne(S), n = v => Number.isFinite(v) ? v.toFixed(0).replace(".", ",") : "";
      const lines = [["Raum", "Theta_int °C", "A m²", "Phi_T W", "Phi_V W", "Phi_RH W", "Phi_HL W", "W/m²"].join("\t"),
        ...R.raeume.map(x => [x.r.name, n(x.ti), (x.A || 0).toFixed(1).replace(".", ","), n(x.PhiT), n(x.PhiV), n(x.PhiHU), n(x.HL), n(x.spez)].join("\t")),
        ["Gebäudeheizlast", "", R.Ages.toFixed(1).replace(".", ","), n(R.PhiT_geb), n(R.PhiV_geb), n(R.PhiHU_geb), n(R.HL_geb), n(R.HL_geb / R.Ages)].join("\t")];
      copy(lines.join("\n"), "Tabelle"); return;
    }
    case "copyJSON": copy(JSON.stringify(S, null, 1), "Projekt"); return;
    case "impTxt": importText($("#imp-txt").value); return;
    case "askNeu": ui.confirm = "neu"; break;
    case "askBeispiel": ui.confirm = "beispiel"; break;
    case "neu": S = leer(); ui.confirm = null; ui.open.clear(); ui.step = 0; break;
    case "beispiel": S = beispiel(); ui.confirm = null; ui.open.clear(); break;
    default: return;
  }
  save(); render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (ui.step === 4) drawCharts(); });
new MutationObserver(() => { if (ui.step === 4) drawCharts(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

if (S.raeume[0] && !ui.open.size) ui.open.add(S.raeume[0].id);
render();
</script>
